<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Check In</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="checkin-page">
    <nav class="top-nav">
      <a href="/map.html">Map</a>
      <a href="/backdate.html">Backdate</a>
      <a href="/timeline.html">Timeline</a>
    </nav>

    <div id="login-screen" class="login-screen">
      <div class="login-box">
        <h1>Check In</h1>
        <p>Enter Hugh's password to continue.</p>
        <input type="password" id="password" placeholder="Password" />
        <button id="login-btn">Log in</button>
        <div id="login-status" class="status"></div>
      </div>
    </div>

    <div id="checkin-screen" class="checkin-screen" hidden>
      <div class="preview-area">
        <div id="preview-placeholder" class="preview-placeholder">
          Tap "Take photo" below to get started
        </div>
        <img id="preview-bg" class="photo-bg" alt="" aria-hidden="true" hidden />
        <img id="preview-img" alt="Selected check-in photo" hidden />
        <div class="fade"></div>
      </div>

      <div class="sheet">
        <div id="location-status" class="status-line">Location: not captured yet</div>

        <div id="nearby-chips" class="chips" hidden></div>

        <button id="show-name-place-btn" type="button" class="link-btn" hidden>
          + Name this place
        </button>
        <div id="name-place-row" class="name-place-row" hidden>
          <input type="text" id="new-location-name" placeholder="e.g. Home, Office" />
          <button id="save-location-btn" type="button" class="small">Save</button>
        </div>
        <div id="location-error" class="status-line error"></div>

        <div id="submit-status" class="status-line"></div>

        <label for="photo" class="file-label">📷 Take photo</label>
        <input type="file" id="photo" accept="image/*" capture="environment" />

        <div class="button-row">
          <button id="capture-location-btn" type="button" class="secondary">
            📍 Capture location
          </button>
          <button id="submit-btn" disabled>Check in</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
