services:
  # Local-dev-only database, matching the managed Aiven for PostgreSQL
  # service (PG 18 + PostGIS 3.6.4) so schema/extension behavior lines up.
  # Not used in production — that's the Aiven service via DATABASE_URL.
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hellohugh
      POSTGRES_USER: hellohugh
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellohugh"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3001"
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
      HUGH_PASSWORD: ${HUGH_PASSWORD}
      # Always the local db above — deliberately NOT read from the host env,
      # so a DATABASE_URL exported by fnox can't leak in. Deployed, Aiven
      # injects the real DATABASE_URL itself.
      DATABASE_URL: postgres://hellohugh:localdev@db:5432/hellohugh
      S3_ENDPOINT: ${S3_ENDPOINT_URI}
      S3_REGION: ${S3_REGION:-nyc3}
      S3_BUCKET: ${S3_BUCKET:-hugh}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_READ: ${S3_PUBLIC_READ:-false}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-hello-hugh-checkin-poc}
      CORS_ORIGIN: ${CORS_ORIGIN:-}

volumes:
  db-data:
